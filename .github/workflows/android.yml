name: Android Build

on:
  push:
    branches:
      - "main"
      - "v1-release-hardening"
      - "mvp-webview-social-shell"
      - "v1.1.1-ux-threads-fix"
      - "v1.2.1-privacy-hardening"
      - "v2.0.0-development"
      - "v2.0.0-stability"
  pull_request:
    branches:
      - "main"
      - "v1-release-hardening"
      - "v1.1.1-ux-threads-fix"
      - "v1.2.1-privacy-hardening"
      - "v2.0.0-development"
      - "v2.0.0-stability"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Unit tests
        run: gradle testDebugUnitTest

      - name: Assemble installable debug APK
        run: gradle assembleDebug

      - name: Prepare optional release signing
        if: ${{ env.HAS_SIGNING_KEY != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/doomscroll-upload.jks"

      - name: Assemble release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.HAS_SIGNING_KEY != '' && format('{0}/doomscroll-upload.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Build release AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.HAS_SIGNING_KEY != '' && format('{0}/doomscroll-upload.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle bundleRelease

      - name: Name installable debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DoomScroll-v2.0.0-beta.2-debug-installable.apk

      - name: Verify installable debug APK exists
        run: test -s DoomScroll-v2.0.0-beta.2-debug-installable.apk

      - name: Upload installable and release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DoomScroll-v2.0.0-beta.2-build
          path: |
            DoomScroll-v2.0.0-beta.2-debug-installable.apk
            app/build/outputs/apk/release/app-release*.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
