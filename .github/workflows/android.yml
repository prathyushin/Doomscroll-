name: Android Build

on:
  push:
    branches:
      - "main"
      - "v1-release-hardening"
      - "mvp-webview-social-shell"
      - "v1.1.1-ux-threads-fix"
      - "v1.2.1-privacy-hardening"
      - "v2.0.0-development"
      - "release/**"
  pull_request:
    branches:
      - "main"
      - "v1-release-hardening"
      - "v1.1.1-ux-threads-fix"
      - "v1.2.1-privacy-hardening"
      - "v2.0.0-development"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Unit tests
        run: gradle testDebugUnitTest

      - name: Assemble installable debug APK
        run: gradle assembleDebug

      - name: Prepare optional release signing
        if: ${{ env.HAS_SIGNING_KEY != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/doomscroll-upload.jks"

      - name: Assemble release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.HAS_SIGNING_KEY != '' && format('{0}/doomscroll-upload.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Build release AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.HAS_SIGNING_KEY != '' && format('{0}/doomscroll-upload.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle bundleRelease

      - name: Name installable debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DoomScroll-v2.0.0-debug-installable.apk

      - name: Upload installable and release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DoomScroll-v2.0.0-build
          path: |
            DoomScroll-v2.0.0-debug-installable.apk
            app/build/outputs/apk/release/app-release*.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Create release checksums
        if: ${{ github.ref == 'refs/heads/release/v2.0.0-beta.1' }}
        run: sha256sum DoomScroll-v2.0.0-debug-installable.apk > SHA256SUMS.txt

      - name: Publish public GitHub beta release
        if: ${{ github.ref == 'refs/heads/release/v2.0.0-beta.1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          # Doom Scroll v2.0.0 Beta 1

          This is a **public beta build** for early Android testing.

          ## Download
          - DoomScroll-v2.0.0-debug-installable.apk — installable debug-signed APK.
          - SHA256SUMS.txt — SHA-256 checksum for the APK.

          ## Important
          - This is a beta/debug-signed build, not a production-signed release or Google Play build.
          - Android may show a warning when installing an APK downloaded outside Google Play.
          - Minimum Android version: Android 8.0 (API 26).
          - Some feed-filtering behaviour depends on Instagram/Threads web page structure and may change when those services update.
          - Learning Focus is experimental. Some settings are still groundwork and may not yet have a visible effect.
          - Doom Scroll is an independent project and is not affiliated with or endorsed by Meta.

          Please report reproducible issues through the repository's GitHub Issues.
          EOF
          gh release create v2.0.0-beta.1 \
            DoomScroll-v2.0.0-debug-installable.apk SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Doom Scroll v2.0.0 Beta 1" \
            --notes-file RELEASE_NOTES.md
