name: Publish public Android release

on:
  push:
    branches: ["v1-release-hardening"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Build installable Android APK
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk DoomScroll-v1.2.1.apk
          sha256sum DoomScroll-v1.2.1.apk > SHA256SUMS.txt

      - name: Publish public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.2.1"
          TITLE="Doom Scroll v1.2.1"
          NOTES="Doom Scroll v1.2.1 — privacy-minimized public Android device-testing release candidate.

          DOWNLOAD: Download DoomScroll-v1.2.1.apk from the Assets section below.

          WHAT'S INCLUDED
          - Instagram and Threads in one Android app
          - Persistent supported website sessions
          - Instagram Explore and Reels-feed restrictions
          - DM-origin single-Reel handling
          - Long-press Instagram Story tiles to mute/unmute locally
          - Floating auto-hiding glass-style app switcher
          - Pure black dark interface
          - Android system picker bridge for website-requested photo/video selection (pending device verification)
          - Just-in-time Android camera/microphone permission bridge for trusted platform origins (pending device verification)
          - Best-effort Following-feed selection and explicit recommendation-card suppression (website markup dependent)
                              - Instagram Stories and Reels remain in the original web viewer
          - Fullscreen support when the web player requests it
          - External web links open in the system browser

          NOT INCLUDED IN THIS BUILD
          - Configurable usage limits or in-feed limit reminders
          - Guaranteed removal of every recommendation or guaranteed chronological ordering where Meta does not expose a Following feed
          - Push notifications originating from the embedded WebViews; the optional listener can only filter notifications posted by separately installed official apps

          PRIVACY
          - Instagram/Threads login sessions are maintained by Android WebView cookies stored locally on the device; these are required for sign-in persistence.
          - Doom Scroll does not upload login cookies, passwords, notification contents, or usage data to a Doom Scroll server.
          - Camera/microphone are requested only after a trusted Instagram/Threads page initiates a capture request.
          - Story mute choices last only for the current app session and are not persisted.

          IMPORTANT
          This APK is signed with Android's standard debug key for public evaluation and device testing. It is not a production-signed Play Store release. The official Instagram and Threads websites control login, site markup, and feature availability, so compatibility can change.

          SOURCE CODE
          https://github.com/prathyushin/Doomscroll-/tree/v1.2.1-shared-login-media

          BUG REPORTS
          https://github.com/prathyushin/Doomscroll-/issues/new?template=bug_report.yml"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" DoomScroll-v1.2.1.apk SHA256SUMS.txt --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest
          else
            gh release create "$TAG" DoomScroll-v1.2.1.apk SHA256SUMS.txt \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest \
              --target "$GITHUB_SHA"
          fi
